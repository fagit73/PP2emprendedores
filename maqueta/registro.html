<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>

<div class="contenedor">
    
    <!-- SECCIÓN 1: Formulario de Registro (Se ocultará al enviar) -->
    <div id="pantalla-registro">
        <header>
            <h1>Crear cuenta</h1>
            <p>Completa los datos</p>
        </header>

        <form id="registroForm">
            <label class="required-label">Nombre completo</label>
            <input type="text" placeholder="Tu nombre completo" required>

            <label class="required-label">DNI</label>
            <input type="text" placeholder="12345678" required>

            <label class="required-label">Celular</label>
            <input type="text" placeholder="+54 9 11 1234-5678" required>

            <label class="required-label">Email institucional</label>
            <input type="email" placeholder="usuario@institucion.edu" required>

            <label class="required-label">Email de recuperación</label>
            <input type="email" placeholder="tu@correo.com" required>

            <label class="required-label">Contraseña</label>
            <input type="password" placeholder="********" required>

            <button type="submit" class="btn-registro">Registrarse</button>
        </form>

        <a href="login.html" class="link link-azul">← Volver al login</a>
    </div>

    <!-- SECCIÓN 2: Vista de Éxito (Se mostrará al enviar) -->
    <div id="pantalla-exito-registro" style="display: none;">
        <header>
            <h1>¡Bienvenido!</h1>
            <p>Tu cuenta ha sido creada</p>
        </header>

        <a href="login.html" class="link-volver">← Ir al login para ingresar</a>

        <div class="alerta-mensaje-verde">
            <span>✓ Registro completado. Ya podés iniciar sesión.</span>
        </div>
    </div>

</div>

<!-- LÓGICA JAVASCRIPT -->
<script>
    const registroForm = document.getElementById('registroForm');
    const pantallaReg = document.getElementById('pantalla-registro');
    const pantallaExitoReg = document.getElementById('pantalla-exito-registro');

    registroForm.addEventListener('submit', (e) => {
        e.preventDefault(); // Evita que la página se recargue

        // 1. Intercambio visual de pantallas
        pantallaReg.style.display = 'none';
        pantallaExitoReg.style.display = 'block';
        pantallaExitoReg.classList.add('fade-in');

        // 2. Limpiar el formulario
        registroForm.reset();

        // 3. Redirección automática al Login tras 3 segundos
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 3000);
    });
</script>

</body>
</html>
