<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/registro.css">

</head>

<body>

    <!-- Contenedor principal -->
    <div class="contenedor">

        <!-- Pantalla formulario -->
        <div id="pantalla-registro">

            <header>

                <h1>Crear cuenta</h1>

                <p>Completa los datos</p>

            </header>

            <!-- Formulario -->
            <form id="registroForm">

                <!-- Nombre -->
                <label class="required-label">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Tu nombre completo"
                    required
                >

                <!-- DNI -->
                <label class="required-label">
                    DNI
                </label>

                <input
                    type="text"
                    id="dni"
                    placeholder="12345678"
                    required
                >

                <!-- Celular -->
                <label class="required-label">
                    Celular
                </label>

                <input
                    type="text"
                    id="celular"
                    placeholder="+54 9 11 1234-5678"
                    required
                >

                <!-- Email institucional -->
                <label class="required-label">
                    Email institucional
                </label>

                <input
                    type="email"
                    id="emailInstitucional"
                    placeholder="usuario@institucion.edu"
                    required
                >

                <!-- Email recuperación -->
                <label class="required-label">
                    Email de recuperación
                </label>

                <input
                    type="email"
                    id="emailRecuperacion"
                    placeholder="tu@correo.com"
                    required
                >

                <!-- Password -->
                <label class="required-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="********"
                    required
                >

                <!-- Botón -->
                <button
                    type="submit"
                    class="btn-registro"
                >
                    Registrarse
                </button>

            </form>

            <!-- Volver -->
            <a href="login.html"
               class="link link-azul">

                ← Volver al login

            </a>

        </div>

        <!-- Pantalla éxito -->
        <div id="pantalla-exito-registro"
             style="display:none;">

            <header>

                <h1>¡Bienvenido!</h1>

                <p>Tu cuenta ha sido creada</p>

            </header>

            <a href="login.html"
               class="link-volver">

                ← Ir al login

            </a>

            <div class="alerta-mensaje-verde">

                ✓ Registro completado correctamente

            </div>

        </div>

    </div>

    <!-- JS -->
    <script src="js/registro.js"></script>

</body>

</html>
