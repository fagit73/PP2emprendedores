<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reserva</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/editar_reserva.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <div class="title-section">
                <h1>Editar Reserva</h1>
                <p>Modifica el horario o propósito de tu reserva</p>
            </div>
            <button class="btn-volver" onclick="window.history.back()">← Volver</button>
        </div>

        <div class="card current-info">
            <h3>Reserva Actual</h3>
            <div class="row">
                <div class="col">
                    <span class="label">Día</span>
                    <span class="value" id="current-dia"></span> 
                </div>
                <div class="col">
                    <span class="label">Horario</span>
                    <span class="value" id="current-horario"></span> 
                </div>
                <div class="col">
                    <span class="label">Fecha</span>
                    <span class="value" id="current-fecha"></span> 
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <span class="label">Propósito</span>
                    <span class="value" id="current-motivo"></span> 
                </div>
                <!-- CAMBIO: Mostrar Docente si existe -->
                <div class="col" id="current-docente-wrapper" style="display:none;">
                    <span class="label">Docente/Responsable</span>
                    <span class="value" id="current-docente"></span> 
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3>Selecciona Nuevo Horario y Fecha</h3>
            
            <div class="booking-layout">
                <div class="calendar-panel">
                    <div id="calendarContainer" class="calendar-container">
                        <div class="calendar-header">
                            <button id="prevMonth" class="btn-nav">&lt;</button>
                            <h4 id="currentMonthYear">Mes Año</h4>
                            <button id="nextMonth" class="btn-nav">&gt;</button>
                        </div>
                        <div class="calendar-days-header">
                            <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span>
                        </div>
                        <div id="calendarDays" class="calendar-days">
                            <!-- Los días se generarán con JS -->
                        </div>
                    </div>
                </div>

                <div class="time-panel">
                    <div id="timeSlotsContainer" class="time-slots-container" style="display: none;">
                        <h4 id="selectedDateText">Selecciona un horario</h4>
                        <div id="timeSlotsGrid" class="time-slots-grid">
                            <!-- Los horarios se generarán con JS -->
                        </div>
                    </div>
                    <div id="noDateSelected" class="no-date-msg">
                        <p>Selecciona un día para cambiar la fecha y el horario.</p>
                    </div>
                </div>
            </div>
            
            <input type="hidden" id="input-fecha">
            <input type="hidden" id="select-horario">
            <input type="hidden" id="select-dia">
        </div>

        <div class="card edit-purpose">
            <h3>Editar Detalles</h3>
            
            <!-- CAMBIO: Campos adicionales en edición si es modo formulario -->
            <div id="editFormFields" style="display: none; margin-bottom: 20px;">
                <div class="input-group">
                    <label>Docente/Responsable</label>
                    <input type="text" id="editDocente" class="form-input">
                </div>
                <div class="input-group">
                    <label>Palabras clave</label>
                    <input type="text" id="editPalabrasClave" class="form-input" list="keywordsList">
                    <datalist id="keywordsList"></datalist>
                </div>
            </div>

            <!-- CAMBIO: Gestión de cambio de archivo en edición -->
            <div id="editFileFields" style="display: none; margin-bottom: 20px;">
                <div class="input-group">
                    <label>Cambiar Archivo (.doc, .pdf)</label>
                    <input type="file" id="editArchivo" accept=".doc,.pdf" class="form-input">
                    <p id="editFileStatus" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;"></p>
                </div>
            </div>

            <div class="input-group">
                <label id="labelMotivo">Motivo / Título</label>
                <input type="text" id="input-motivo" placeholder="Escribe el propósito..." value="">
            </div>
        </div>

        <div class="actions">
            <button class="btn-save" id="btn-guardar">✓ Guardar Cambios</button>
            <button class="btn-cancel" id="btn-cancelar-reserva">✕ Eliminar Reserva</button>
        </div>
    </div>
     
    <script src="js/editar_reserva.js"></script>
</body>
</html>
