<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña</title>

    <link rel="stylesheet"
          href="css/recuperar.css">

</head>

<body>

    <div class="contenedor">

        <!-- Formulario -->
        <div id="pantalla-formulario">

            <header>

                <h1>Recuperar contraseña</h1>

                <p>Te enviaremos instrucciones</p>

            </header>

            <form id="recuperarForm">

                <label class="required-recuperar">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="tu@correo.com"
                    required
                >

                <button
                    type="submit"
                    class="btn-naranja"
                >
                    Enviar enlace
                </button>

                <a href="login.html" class="btn-volver-azul">← Volver</a>
                

            </form>

        </div>

        <!-- Éxito -->
        <div id="pantalla-exito"
             style="display:none;">

            <header>

                <h1>Correo enviado</h1>

                <p>Revisa tu bandeja</p>

            </header>

            <div class="alerta-mensaje-verde">

                ✓ Revisa tu correo para recuperar tu contraseña

            </div>

        </div>

    </div>

    <!-- JS -->
    <script src="js/recuperar.js"></script>

</body>

</html>
