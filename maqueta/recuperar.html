<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/recuperar.css">
</head>
<body>

    <div class="contenedor">
        
        <!-- SECCIÓN 1: Formulario -->
        <div id="pantalla-formulario">
            <header>
                <h1>Recuperar contraseña</h1>
                <p>Te enviaremos instrucciones</p>
            </header>

            <form id="recuperarForm">
                <div class="grupo-input">
                    <label for="email" class="required-recuperar">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="tu@correo.com" 
                        required
                    >
                </div>

                <button type="submit" class="btn-naranja">
                    Enviar enlace
                </button>
            </form>
        </div>

        <!-- SECCIÓN 2: Vista de Éxito -->
        <div id="pantalla-exito" style="display: none;">
            <header>
                <h1 class="titulo-exito">Recuperar contraseña</h1>
                <p>Te enviaremos instrucciones</p>
            </header>

            <a href="login.html" class="link-volver">← Volver al login</a>

            <div class="alerta-mensaje-verde">
                <span>✓ Revisa tu correo para recuperar tu contraseña</span>
            </div>
        </div>

    </div>

    <!-- LÓGICA JAVASCRIPT UNIFICADA -->
    <script>
        const formulario = document.getElementById('recuperarForm');
        const pantallaForm = document.getElementById('pantalla-formulario');
        const pantallaExito = document.getElementById('pantalla-exito');

        formulario.addEventListener('submit', (e) => {
            e.preventDefault(); 
            
            // 1. Cambio visual
            pantallaForm.style.display = 'none';
            pantallaExito.style.display = 'block';
            pantallaExito.classList.add('fade-in');

            // 2. Redirección automática tras 3 segundos
            console.log("Iniciando temporizador de 3 segundos...");
            
            setTimeout(() => {
                console.log("Redirigiendo a login.html...");
                window.location.href = 'login.html'; 
            }, 3000); 
        });
    </script>

</body>
</html>
