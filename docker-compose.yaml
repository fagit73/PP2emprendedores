services:
  web:
    image: nginx:alpine
    container_name: nginx_container
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html/biblio-ifts
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
  php:
    build: ./php
    container_name: php_container
    environment:
      DB_HOST: db
      DB_NAME: turnos-biblioteca
      DB_USER: root
      DB_PASS: biblio-ifts
      APP_URL: http://34.82.217.72
    volumes:
      - .:/var/www/html/biblio-ifts
    depends_on:
      - db
  db:
    image: mariadb:lts
    container_name: mariadb_container
    command: --innodb-buffer-pool-size=64M --max-connections=20
    environment:
      MARIADB_ROOT_PASSWORD: biblio-ifts
      MARIADB_DATABASE: turnos-biblioteca
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  dbdata:
